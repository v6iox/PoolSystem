# Moonpool on the Raspberry Pi — everything local, three core services.
#
#   docker compose up -d --build
#
# Optional remote access (no VPN app on your phone):
#   docker compose --profile remote up -d      # requires TUNNEL_TOKEN in .env

services:
  # nodejs-poolController — talks RS-485 to the Pentair panel via USB adapter.
  njspc:
    # Built from upstream source rather than pulled: the project publishes no
    # official image (tagyoureit/nodejs-poolcontroller does not exist on Docker
    # Hub, and there is no GHCR package), and the third-party rebuilds that do
    # exist are not worth trusting with RS-485 access to the panel. Pinned to a
    # tag so a rebuild can't silently pick up new upstream code.
    build:
      context: https://github.com/tagyoureit/nodejs-poolController.git#v10.0.0
    image: moonpool/njspc:v10.0.0
    restart: unless-stopped
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    # The upstream image runs as the unprivileged `node` user, and USB serial
    # adapters are root:plugdev 0660 on Raspberry Pi OS — so without this the
    # container starts fine and then loops on "Permission denied, cannot open
    # /dev/ttyUSB0". 46 is plugdev on Debian; override if your host differs
    # (getent group plugdev).
    group_add:
      - "${SERIAL_GROUP_ID:-46}"
    volumes:
      - njspc-data:/app/data
      - njspc-config:/app/config
    environment:
      - TZ=${TZ:-America/Denver}
    # njsPC has no auth — never publish this port beyond the Pi.
    # Moonpool reaches it over the internal compose network.
    expose:
      - "4200"

  # Moonpool — the app you actually open. The ONLY service that should be exposed.
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - njspc
    ports:
      - "3000:3000"
      # Tempest hub UDP broadcasts. If your Docker network can't see LAN
      # broadcasts (common with bridge networking), use the TEMPEST_TOKEN
      # REST fallback or switch this service to network_mode: host.
      - "50222:50222/udp"
    volumes:
      - moonpool-data:/data
    environment:
      - NJSPC_URL=http://njspc:4200
      - MOCK_MODE=${MOCK_MODE:-false}
      - DATABASE_PATH=/data/moonpool.db
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env}
      - COPILOT_BASE_URL=${COPILOT_BASE_URL:-http://ollama:11434/v1}
      - COPILOT_MODEL=${COPILOT_MODEL:-qwen3:1.7b}
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
      - COPILOT_CONTEXT_TOKENS=${COPILOT_CONTEXT_TOKENS:-4096}
      # Which brain the copilot uses. COPILOT_FORCE_MOCK=true selects the
      # deterministic parser — no model, no memory, instant — which is the only
      # workable option on hardware that can't host an LLM. Without these two
      # passed through, setting them in .env has no effect inside the container.
      - COPILOT_FORCE_MOCK=${COPILOT_FORCE_MOCK:-false}
      - COPILOT_FORCE_LLM=${COPILOT_FORCE_LLM:-false}
      - POOL_LATITUDE=${POOL_LATITUDE:-39.74}
      - POOL_LONGITUDE=${POOL_LONGITUDE:--104.99}
      - TEMPEST_UDP=${TEMPEST_UDP:-true}
      - TEMPEST_TOKEN=${TEMPEST_TOKEN:-}
      - TEMPEST_STATION_ID=${TEMPEST_STATION_ID:-}
      - UPDATER_URL=http://updater:9888
      - MOONPOOL_REPO_SLUG=${MOONPOOL_REPO_SLUG:-v6iox/poolsystem}
      - TZ=${TZ:-America/Denver}

  # Local LLM for the Pool Copilot. First run: docker compose exec ollama ollama pull qwen3:1.7b
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # The system prompt alone is ~1680 tokens; a full chat history pushes a
      # request to ~2170, which silently truncated the front of the prompt at
      # the old 2048. 4096 fits with headroom (measured: qwen3:0.6b 0.80 GB
      # resident, qwen3:1.7b 1.66 GB). Keep COPILOT_CONTEXT_TOKENS in step.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      # Halves KV-cache memory — the difference between fitting a 2 GB Pi and not.
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
    expose:
      - "11434"

  # Auto-update sidecar: the only container with the Docker socket. The web
  # app asks it (internal network, bearer token) to check out a release tag
  # and rebuild `web` — nightly if enabled in Settings, or on demand.
  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    environment:
      - UPDATER_TOKEN=${AUTH_SECRET:?set AUTH_SECRET in .env}
      - TZ=${TZ:-America/Denver}
    expose:
      - "9888"

  # Optional: Cloudflare Tunnel for remote access from anywhere — outbound-only,
  # no port forwarding, no VPN client on the phone. See README "Remote access".
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["remote"]
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?` — Compose interpolates every service's variables even when the
      # service's profile is inactive, so a required-here token made plain
      # `docker compose up` fail for everyone who never wanted a tunnel. The
      # profile is the gate; cloudflared exits on its own if the token is blank.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Optional: direct port-forward remote access with automatic HTTPS — no VPN,
  # no tunnel account. Point a domain (or DDNS name) at your home IP, forward
  # ports 80 + 443 on the router to the Pi, set MOONPOOL_DOMAIN in .env, then:
  #   docker compose --profile expose up -d
  # Caddy fetches and renews the Let's Encrypt certificate itself, and its
  # X-Forwarded-Proto header makes Moonpool issue Secure cookies. Never forward
  # port 3000 directly — that would send passwords over the internet in clear.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["expose"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MOONPOOL_DOMAIN=${MOONPOOL_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  moonpool-data:
  njspc-data:
  njspc-config:
  ollama-models:
  caddy-data:
  caddy-config:
