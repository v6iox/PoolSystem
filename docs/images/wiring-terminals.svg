<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1000" height="620" rx="16" fill="#071522"/>
  <text x="40" y="52" fill="#e6f3f7" font-size="24" font-weight="700">The two wires — panel COM port → USB adapter</text>
  <text x="40" y="78" fill="#94b8c7" font-size="14">Only the two data wires are needed. Never connect the red +15 V terminal to your adapter.</text>

  <!-- Panel COM connector close-up -->
  <rect x="60" y="130" width="300" height="360" rx="14" fill="#0c2130" stroke="#2b4a5e" stroke-width="1.5"/>
  <text x="210" y="162" fill="#e6f3f7" font-size="15" font-weight="700" text-anchor="middle">Panel COM port (close-up)</text>
  <text x="210" y="182" fill="#5b7c8c" font-size="11.5" text-anchor="middle">green screw-terminal block on the board</text>

  <rect x="120" y="200" width="180" height="250" rx="10" fill="#123125" stroke="#2f7d4f" stroke-width="2"/>

  <!-- Terminal 1: RED -->
  <circle cx="150" cy="240" r="13" fill="#0a1a12" stroke="#c0392b" stroke-width="3"/>
  <rect x="132" y="234" width="8" height="12" fill="#c0392b"/>
  <text x="175" y="237" fill="#ff9d9d" font-size="13" font-weight="700">RED · +15 VDC</text>
  <text x="175" y="253" fill="#8a5a5e" font-size="11">DO NOT CONNECT</text>

  <!-- Terminal 2: YELLOW -->
  <circle cx="150" cy="300" r="13" fill="#0a1a12" stroke="#e8c74a" stroke-width="3"/>
  <rect x="132" y="294" width="8" height="12" fill="#e8c74a"/>
  <text x="175" y="297" fill="#f2df9a" font-size="13" font-weight="700">YEL · +DATA</text>
  <text x="175" y="313" fill="#9a8f5e" font-size="11">→ adapter A / D+</text>

  <!-- Terminal 3: GREEN -->
  <circle cx="150" cy="360" r="13" fill="#0a1a12" stroke="#4fae6d" stroke-width="3"/>
  <rect x="132" y="354" width="8" height="12" fill="#4fae6d"/>
  <text x="175" y="357" fill="#a9e3bd" font-size="13" font-weight="700">GRN · −DATA</text>
  <text x="175" y="373" fill="#5b9c74" font-size="11">→ adapter B / D−</text>

  <!-- Terminal 4: BLACK -->
  <circle cx="150" cy="420" r="13" fill="#0a1a12" stroke="#6b7a85" stroke-width="3"/>
  <rect x="132" y="414" width="8" height="12" fill="#6b7a85"/>
  <text x="175" y="417" fill="#aebfc9" font-size="13" font-weight="700">BLK · GND</text>
  <text x="175" y="433" fill="#5b7c8c" font-size="11">optional (shield)</text>

  <!-- Wires to adapter -->
  <path d="M163 300 C 420 300, 430 285, 600 285" stroke="#e8c74a" stroke-width="5" fill="none"/>
  <path d="M163 360 C 420 360, 430 335, 600 335" stroke="#4fae6d" stroke-width="5" fill="none"/>
  <text x="440" y="225" fill="#94b8c7" font-size="12" text-anchor="middle">any 2-conductor wire — 18–22 AWG, twisted pair ideal</text>

  <!-- USB adapter -->
  <rect x="600" y="240" width="240" height="150" rx="14" fill="#0c2c3e" stroke="#3a7d94" stroke-width="2"/>
  <text x="720" y="270" fill="#7de3f4" font-size="15" font-weight="700" text-anchor="middle">USB RS-485 adapter</text>
  <circle cx="620" cy="285" r="9" fill="#0a1a12" stroke="#e8c74a" stroke-width="3"/>
  <text x="640" y="290" fill="#f2df9a" font-size="13" font-weight="700">A  (D+ / +)</text>
  <circle cx="620" cy="335" r="9" fill="#0a1a12" stroke="#4fae6d" stroke-width="3"/>
  <text x="640" y="340" fill="#a9e3bd" font-size="13" font-weight="700">B  (D− / −)</text>
  <text x="720" y="372" fill="#5b7c8c" font-size="11" text-anchor="middle">labels vary: A/B, D+/D−, T/R+ T/R−</text>

  <!-- USB to Pi -->
  <path d="M840 315 H 890" stroke="#7de3f4" stroke-width="4"/>
  <rect x="890" y="270" width="80" height="90" rx="10" fill="#0c2c3e" stroke="#3a7d94" stroke-width="2"/>
  <text x="930" y="305" fill="#7de3f4" font-size="13" font-weight="700" text-anchor="middle">Pi</text>
  <text x="930" y="325" fill="#94b8c7" font-size="10.5" text-anchor="middle">any USB</text>
  <text x="930" y="340" fill="#94b8c7" font-size="10.5" text-anchor="middle">port</text>

  <!-- Callouts -->
  <rect x="60" y="520" width="430" height="66" rx="12" fill="#3a1d20" stroke="#8a4a50"/>
  <text x="80" y="548" fill="#ff9d9d" font-size="13.5" font-weight="700">⚡ Before opening the panel:</text>
  <text x="80" y="568" fill="#e0b0b4" font-size="12.5">kill power at the breaker. High voltage lives in there.</text>

  <rect x="510" y="520" width="430" height="66" rx="12" fill="#3a3320" stroke="#8a7a4a"/>
  <text x="530" y="548" fill="#ffd166" font-size="13.5" font-weight="700">No data after boot?</text>
  <text x="530" y="568" fill="#d9c690" font-size="12.5">Swap the two wires at the adapter — reversed polarity is harmless.</text>
</svg>
