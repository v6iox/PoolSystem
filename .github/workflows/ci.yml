name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Copilot eval + unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          MOCK_MODE: "true"
      - name: Installer syntax
        run: bash -n install.sh
