name: Release

# Pushing a tag like v1.0.0 creates the GitHub Release with the installer
# attached, so the docs' one-liner always works:
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | bash
#
# NOTE: bump "version" in package.json to match the tag before releasing —
# the in-app auto-updater compares package.json against the latest release
# tag to decide whether an update exists.

on:
  push:
    tags: ["v*"]
  # Manual cut: creates the tag at the chosen ref and publishes the release.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Moonpool ${{ inputs.tag_name || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: install.sh
